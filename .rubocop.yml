plugins:
  - rubocop-minitest

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/Documentation:
  Exclude:
    - "test/**/*"

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 20
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"
    # Generated: a resource class holds one method per API operation.
    - "lib/teachmehipaa/resources/*.rb"

Metrics/AbcSize:
  Max: 25
  Exclude:
    - "test/**/*"

Metrics/ParameterLists:
  CountKeywordArgs: false

Minitest/MultipleAssertions:
  Max: 12

# The generator's classes all take the parsed IR, the project's term for it.
Naming/MethodParameterName:
  AllowedNames: [as, at, by, cc, db, id, if, in, io, ip, ir, of, on, os, pp, to]

# The sample table holds Ruby source as single-quoted Strings, interpolation
# included, for the generator to emit as is.
Lint/InterpolationCheck:
  Exclude:
    - "scripts/generator/sample_calls.rb"
